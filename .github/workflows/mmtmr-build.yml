name: MMTMR CI build and test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: mmtmr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CI_ROOT: ${{ github.workspace }}/build-checks/github-actions
      DERIVED_DATA: ${{ github.workspace }}/build-checks/github-actions/DerivedData
      SOURCE_PACKAGES: ${{ github.workspace }}/build-checks/github-actions/SourcePackages

    steps:
      - name: Check out MMTMR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          node --version
          npm --version

      - name: Test and build the web editor
        working-directory: Web
        run: |
          npm ci --cache "$CI_ROOT/npm-cache" --prefer-offline --no-audit
          npm test
          npm run build

      - name: Resolve Swift packages
        run: |
          mkdir -p "$CI_ROOT"
          xcodebuild -resolvePackageDependencies \
            -project MTMR.xcodeproj \
            -scheme MMTMR \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Run Swift tests
        run: |
          set -o pipefail
          set +e
          xcodebuild test \
            -project MTMR.xcodeproj \
            -scheme MMTMR \
            -configuration Debug \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -resultBundlePath "$CI_ROOT/MMTMRTests.xcresult" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CI_ROOT/swift-tests.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          if test "$XCODE_STATUS" -ne 0; then
            set +o pipefail
            grep -E '(^|: )(error:|fatal error:)|Testing failed:' "$CI_ROOT/swift-tests.log" \
              | tail -n 20 \
              | sed 's/^/::error title=Xcode test::/'
            tail -n 20 "$CI_ROOT/swift-tests.log" \
              | sed 's/^/::error title=Xcode test tail::/'
            exit "$XCODE_STATUS"
          fi

      - name: Archive the unsigned application
        run: |
          set -o pipefail
          set +e
          xcodebuild archive \
            -project MTMR.xcodeproj \
            -scheme MMTMR \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -archivePath "$CI_ROOT/MMTMR.xcarchive" \
            -onlyUsePackageVersionsFromResolvedFile \
            -disableAutomaticPackageResolution \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$CI_ROOT/archive.log"
          XCODE_STATUS=${PIPESTATUS[0]}
          set -e
          if test "$XCODE_STATUS" -ne 0; then
            set +o pipefail
            grep -E '(^|: )(error:|fatal error:)' "$CI_ROOT/archive.log" \
              | tail -n 20 \
              | sed 's/^/::error title=Xcode archive::/'
            exit "$XCODE_STATUS"
          fi

      - name: Verify the application archive
        run: |
          APP_PATH="$CI_ROOT/MMTMR.xcarchive/Products/Applications/MMTMR.app"
          if ! test -x "$APP_PATH/Contents/MacOS/MMTMR"; then
            echo "::error title=Archive incomplet::L’exécutable MMTMR est absent de l’archive"
            exit 1
          fi
          if ! test -f "$APP_PATH/Contents/Resources/Editor/index.html"; then
            echo "::error title=Éditeur absent::Le build web n’a pas été intégré au bundle"
            exit 1
          fi
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Contents/Info.plist")
          if test "$BUNDLE_ID" != "com.tovam.MMTMR"; then
            echo "::error title=Bundle incorrect::Identifiant trouvé : $BUNDLE_ID"
            exit 1
          fi
          if ! codesign --force --deep --sign - "$APP_PATH"; then
            echo "::error title=Signature ad hoc impossible::codesign n’a pas pu signer l’archive"
            exit 1
          fi
          if ! codesign --verify --deep --strict --verbose=2 "$APP_PATH"; then
            echo "::error title=Bundle invalide::codesign a refusé le bundle signé"
            exit 1
          fi

      - name: Package the application artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$CI_ROOT/MMTMR.xcarchive/Products/Applications/MMTMR.app" \
            "$CI_ROOT/MMTMR-unsigned.zip"

      - name: Upload the application
        uses: actions/upload-artifact@v4
        with:
          name: MMTMR-unsigned-${{ github.sha }}
          path: ${{ env.CI_ROOT }}/MMTMR-unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish the rolling development build
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/mmtmr-build-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="mmtmr-development"
          RELEASE_NOTES="Build automatique non signé de ${GITHUB_SHA}. Tests web et Swift validés par GitHub Actions."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$CI_ROOT/MMTMR-unsigned.zip" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "MMTMR — build de développement" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "$CI_ROOT/MMTMR-unsigned.zip" \
              --target "$GITHUB_SHA" \
              --title "MMTMR — build de développement" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMTMR-test-results-${{ github.sha }}
          path: |
            ${{ env.CI_ROOT }}/MMTMRTests.xcresult
            ${{ env.CI_ROOT }}/swift-tests.log
            ${{ env.CI_ROOT }}/archive.log
          if-no-files-found: ignore
          retention-days: 7
